name: Test suite

# Full pytest suite on Linux AND macOS. macOS matters: its stock /bin/bash is
# 3.2, where `set -u` + empty-array "${ARR[@]}" expansion aborts and `mapfile`
# does not exist — bugs Linux bash >= 4.4 never surfaces. Tests needing
# unavailable environments skip themselves (MiniMax live tests skip without
# MINIMAX_API_KEY) — no curated exclude list.
#
# Taken from upstream's test-suite.yml; the inventory and lint workflows are
# not, because they assert upstream's skill set.

on:
  pull_request:
    paths:
      # skills/ too: the mirror tests check skills/ <-> skills/skills-codex parity,
      # and the AUTO_PROCEED docs test reads both READMEs.
      - 'tools/**'
      - 'tests/**'
      - 'mcp-servers/**'
      - 'skills/**'
      - 'templates/**'
      - 'docs/**'
      - 'README.md'
      - 'README_CN.md'
      - '.github/workflows/test-suite.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'mcp-servers/**'
      - 'skills/**'
      - 'templates/**'
      - 'docs/**'
      - 'README.md'
      - 'README_CN.md'
      - '.github/workflows/test-suite.yml'
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install test dependencies
        run: python -m pip install pytest httpx requests
      - name: Show bash version (the macOS leg must be 3.2.x)
        run: bash --version | head -1
      - name: Run full test suite
        run: python -m pytest tests/ -q
